# === PersistentVolumeClaim para a base de dados SQLite ===

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

# === Backend Deployment ===

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # Trigger automático: quando o build termina e actualiza backend:latest,
    # o OpenShift faz rollout automático deste Deployment
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"backend:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          ports:
            - containerPort: 5214
          env:
            - name: ASPNETCORE_URLS
              value: http://+:5214
            - name: ConnectionStrings__DefaultConnection
              value: Data Source=/app/data/library.db
            - name: HostConnection__Url
              value: http://frontend
            - name: HostConnection__Port
              value: "8080"
          volumeMounts:
            - name: db-storage
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: library-db

---

# === Frontend Deployment ===

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"frontend:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---

# === Services (comunicação interna entre pods) ===

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 5214
      targetPort: 5214

---

apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080

---

# === Route (URL público, gerado automaticamente pelo OpenShift) ===

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gutenberg
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
