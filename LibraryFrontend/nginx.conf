server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api and nginx forwards it to the backend Service,
    # so no CORS configuration is needed in the cluster.
    location /api/ {
        proxy_pass http://gutenberg-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular client-side routing (e.g. /books on refresh or after the Entra redirect).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
